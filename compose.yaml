services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${BEMBOS_SQL_PASSWORD:?Define BEMBOS_SQL_PASSWORD en .env}

    ports:
      - "1433:1433"

    volumes:
      - bembos-sql-data:/var/opt/mssql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1'
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SQLCMDPASSWORD=${BEMBOS_SQL_PASSWORD:?Define BEMBOS_SQL_PASSWORD en .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database/init:/scripts:ro
    entrypoint: /opt/mssql-tools18/bin/sqlcmd
    command:
      - -S
      - sqlserver
      - -U
      - sa
      - -C
      - -b
      - -i
      - /scripts/00-create-database.sql
      - -d
      - master
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=BembosEventsDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${BEMBOS_SQL_PASSWORD:?Define BEMBOS_SQL_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      RESERVA_MONTO_MINIMO: ${RESERVA_MONTO_MINIMO:-500.00}
      RESERVA_PORCENTAJE_DEPOSITO: ${RESERVA_PORCENTAJE_DEPOSITO:-0.50}
      MERCADOPAGO_ENABLED: ${MERCADOPAGO_ENABLED:-false}
      MERCADOPAGO_API_BASE_URL: ${MERCADOPAGO_API_BASE_URL:-https://api.mercadopago.com}
      MERCADOPAGO_ACCESS_TOKEN_TEST: ${MERCADOPAGO_ACCESS_TOKEN_TEST:?Define MERCADOPAGO_ACCESS_TOKEN_TEST en .env}
      MERCADOPAGO_WEBHOOK_SECRET_TEST: ${MERCADOPAGO_WEBHOOK_SECRET_TEST:?Define MERCADOPAGO_WEBHOOK_SECRET_TEST en .env}
      MERCADOPAGO_RETURN_BASE_URL: ${MERCADOPAGO_RETURN_BASE_URL:?Define MERCADOPAGO_RETURN_BASE_URL en .env}
    ports:
      - "8080:8080"
    restart: unless-stopped

  dev-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      backend:
        condition: service_started
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      SQLCMDPASSWORD: ${BEMBOS_SQL_PASSWORD:?Define BEMBOS_SQL_PASSWORD en .env}
    entrypoint:
      - /bin/bash
    command:
      - -c
      - |
        set -e

        echo "Waiting for Flyway schema..."

        until /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$SQLCMDPASSWORD" \
          -C \
          -d BembosEventsDB \
          -Q "SET NOCOUNT ON; IF OBJECT_ID(N'dbo.HorarioSalon', N'U') IS NULL THROW 50000, 'Schema not ready', 1;" \
          >/dev/null 2>&1
        do
          sleep 2
        done

        echo "Flyway schema available. Applying DEV seed..."

        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$SQLCMDPASSWORD" \
          -C \
          -b \
          -d BembosEventsDB \
          -f 65001 -i /scripts/10-seed-catalog.sql
    volumes:
      - ./database/dev:/scripts:ro
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      BackendApi__BaseUrl: http://backend:8080
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeysPath: /var/bembos-events/dpkeys
    ports:
      - "5000:8080"
    volumes:
      - frontend-dp-keys:/var/bembos-events/dpkeys
    restart: unless-stopped
volumes:
  frontend-dp-keys:
  bembos-sql-data:
    name: bembos-sql-data
