services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${BEMBOS_SQL_PASSWORD:?Define BEMBOS_SQL_PASSWORD en .env}

    ports:
      - "1433:1433"

    volumes:
      - bembos-sql-data:/var/opt/mssql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1'
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SQLCMDPASSWORD=${BEMBOS_SQL_PASSWORD:?Define BEMBOS_SQL_PASSWORD en .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database/init:/scripts:ro
    entrypoint: /opt/mssql-tools18/bin/sqlcmd
    command:
      - -S
      - sqlserver
      - -U
      - sa
      - -C
      - -b
      - -i
      - /scripts/00-create-database.sql
      - -d
      - master
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=BembosEventsDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${BEMBOS_SQL_PASSWORD:?Define BEMBOS_SQL_PASSWORD en .env}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  bembos-sql-data:
    name: bembos-sql-data