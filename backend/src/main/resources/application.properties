spring.application.name=BembosEvents

# Datasource con variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate no crea ni modifica tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway para migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Reglas de negocio de reservas
bembos.reserva.monto-minimo=${RESERVA_MONTO_MINIMO}
bembos.reserva.porcentaje-deposito=${RESERVA_PORCENTAJE_DEPOSITO}
# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Seguridad avanzada - login
app.security.login.max-failed-attempts=${SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-duration-minutes=${SECURITY_LOGIN_LOCK_DURATION_MINUTES:15}

# Seguridad avanzada - password recovery
app.security.password-recovery.token-ttl-minutes=${SECURITY_PASSWORD_RECOVERY_TOKEN_TTL_MINUTES:30}

# Seguridad avanzada - email verification
app.security.email-verification.token-ttl-hours=${SECURITY_EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
app.security.email-verification.enforce=${SECURITY_EMAIL_VERIFICATION_ENFORCE:false}
# Mantener nombres fisicos de SQL Server en camelCase
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Seguridad avanzada - email delivery
app.security.email.enabled=${SECURITY_EMAIL_ENABLED:false}
app.security.email.from=${SECURITY_EMAIL_FROM:no-reply@bembosevents.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
