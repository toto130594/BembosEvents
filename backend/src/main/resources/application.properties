spring.application.name=BembosEvents

# Datasource con variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate no crea ni modifica tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway para migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Reglas de negocio de reservas
bembos.reserva.monto-minimo=${RESERVA_MONTO_MINIMO}
bembos.reserva.porcentaje-deposito=${RESERVA_PORCENTAJE_DEPOSITO}
# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Seguridad avanzada - login
app.security.login.max-failed-attempts=${SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-duration-minutes=${SECURITY_LOGIN_LOCK_DURATION_MINUTES:15}

# Seguridad avanzada - password recovery
app.security.password-recovery.token-ttl-minutes=${SECURITY_PASSWORD_RECOVERY_TOKEN_TTL_MINUTES:30}

# Seguridad avanzada - email verification
app.security.email-verification.token-ttl-hours=${SECURITY_EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
app.security.email-verification.enforce=${SECURITY_EMAIL_VERIFICATION_ENFORCE:false}
# Mantener nombres fisicos de SQL Server en camelCase
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Seguridad avanzada - email delivery
app.security.email.enabled=${SECURITY_EMAIL_ENABLED:false}
app.security.email.from=${SECURITY_EMAIL_FROM:no-reply@bembosevents.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# Seguridad avanzada - rate limiting
app.security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}

app.security.rate-limit.login.max-requests=${SECURITY_RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
app.security.rate-limit.login.window-seconds=${SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}

app.security.rate-limit.password-recovery.max-requests=${SECURITY_RATE_LIMIT_PASSWORD_RECOVERY_MAX_REQUESTS:5}
app.security.rate-limit.password-recovery.window-seconds=${SECURITY_RATE_LIMIT_PASSWORD_RECOVERY_WINDOW_SECONDS:900}

app.security.rate-limit.email-verification.max-requests=${SECURITY_RATE_LIMIT_EMAIL_VERIFICATION_MAX_REQUESTS:5}
app.security.rate-limit.email-verification.window-seconds=${SECURITY_RATE_LIMIT_EMAIL_VERIFICATION_WINDOW_SECONDS:900}

# Seguridad avanzada - MFA TOTP
app.security.mfa.enabled=${SECURITY_MFA_ENABLED:false}
app.security.mfa.encryption-key=${SECURITY_MFA_ENCRYPTION_KEY:}
app.security.mfa.issuer=${SECURITY_MFA_ISSUER:Bembos Events}

app.security.mfa.totp.secret-bytes=${SECURITY_MFA_TOTP_SECRET_BYTES:20}
app.security.mfa.totp.digits=${SECURITY_MFA_TOTP_DIGITS:6}
app.security.mfa.totp.period-seconds=${SECURITY_MFA_TOTP_PERIOD_SECONDS:30}
app.security.mfa.totp.allowed-window=${SECURITY_MFA_TOTP_ALLOWED_WINDOW:1}

app.security.mfa.recovery-code.count=${SECURITY_MFA_RECOVERY_CODE_COUNT:8}
app.security.mfa.recovery-code.random-bytes=${SECURITY_MFA_RECOVERY_CODE_RANDOM_BYTES:10}
app.security.mfa.challenge-ttl-minutes=${MFA_CHALLENGE_TTL_MINUTES:5}
app.security.rate-limit.mfa-challenge.max-requests=${SECURITY_RATE_LIMIT_MFA_CHALLENGE_MAX_REQUESTS:5}
app.security.rate-limit.mfa-challenge.window-seconds=${SECURITY_RATE_LIMIT_MFA_CHALLENGE_WINDOW_SECONDS:60}
app.security.session.refresh-ttl-days=${SECURITY_SESSION_REFRESH_TTL_DAYS:30}

# FASE 10.0.5 - Chat IA provider
app.chat.ai.provider=${AI_CHAT_PROVIDER:basic}
app.chat.ai.base-url=${AI_CHAT_BASE_URL:http://host.docker.internal:11434/v1}
app.chat.ai.api-key=${AI_CHAT_API_KEY:}
app.chat.ai.model=${AI_CHAT_MODEL:qwen3:8b}
app.chat.ai.temperature=${AI_CHAT_TEMPERATURE:0.2}

# --- FASE 11 MERCADO PAGO TEST START ---
# Development/test only. Production credentials are intentionally out of scope.
app.mercadopago.enabled=${MERCADOPAGO_ENABLED:false}
app.mercadopago.base-url=${MERCADOPAGO_API_BASE_URL:https://api.mercadopago.com}
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN_TEST:}
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET_TEST:}
# --- FASE 11 MERCADO PAGO TEST END ---
